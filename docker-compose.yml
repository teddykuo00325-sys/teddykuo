# 凌策 LingCe · 一鍵啟動 docker-compose
# 對應 2026-05 三家公司新驗收標準「Docker / 部署腳本」必交項目
#
# 使用方式：
#   docker-compose up        # 預設離線模式（Ollama + 蒸餾 KB）
#   docker-compose up -d     # 背景執行
#
# 評審快速驗證：
#   開啟 http://localhost:5000/dashboard.html
#   curl http://localhost:5000/api/mode      → 確認 offline 模式
#   curl http://localhost:5000/api/agents/levels  → 確認 L1-L4 分級

version: '3.9'

services:
  lingce:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lingce-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # 預設離線模式（依新標準）
      LINGCE_MODE: offline
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      CLAUDE_API_DISABLED: "true"
    volumes:
      # 持久化資料 + 稽核 log
      - ./data:/app/data
      - ./chat_logs:/app/chat_logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - lingce-net

  # 選配：Ollama 本地推論服務
  # 若主機已裝 Ollama，可註解此 service（用 host.docker.internal 連到主機）
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: lingce-ollama
  #   restart: unless-stopped
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-models:/root/.ollama
  #   networks:
  #     - lingce-net

networks:
  lingce-net:
    driver: bridge

